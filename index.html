<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Muhammad Adam — Developer & Creative</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#040410;--bg1:#080818;--bg2:#0b0b20;--bg3:#0f0f28;--bg4:#131330;
  --glass:rgba(255,255,255,0.025);--glassMd:rgba(255,255,255,0.045);--glassHi:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.07);--borderHi:rgba(255,255,255,0.12);
  --indigo:#6366f1;--indigoL:#818cf8;--indigoD:#4f46e5;
  --cyan:#22d3ee;--cyanD:#06b6d4;
  --amber:#f59e0b;--amberL:#fbbf24;
  --emerald:#10b981;--emeraldL:#34d399;
  --pink:#ec4899;--rose:#f43f5e;
  --violet:#8b5cf6;
  --text:#f1f5f9;--textSub:#94a3b8;--textMuted:#475569;--textDim:#2d3748;
  --gIndigo:linear-gradient(135deg,#6366f1,#22d3ee);
  --gWarm:linear-gradient(135deg,#f59e0b,#ec4899);
  --gViolet:linear-gradient(135deg,#8b5cf6,#ec4899);
  --gEmerald:linear-gradient(135deg,#10b981,#22d3ee);
  --glow:0 0 40px rgba(99,102,241,0.2);
  --r:14px;--rLg:20px;--rXl:28px;
  --font:'Plus Jakarta Sans',-apple-system,sans-serif;
  --mono:'Space Mono',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden;cursor:none;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--indigo);border-radius:2px}

/* ── CURSOR ──────────────────────────────── */
.c-dot{width:5px;height:5px;background:#fff;border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:transform .08s}
.c-ring{width:32px;height:32px;border:1.5px solid rgba(99,102,241,.65);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .3s,background .3s}
.c-ring.hov{width:52px;height:52px;border-color:var(--indigo);background:rgba(99,102,241,.07)}

/* ── NAVBAR ──────────────────────────────── */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:1.6rem 6%;display:flex;justify-content:space-between;align-items:center;transition:all .4s}
.nav.solid{background:rgba(4,4,16,.93);backdrop-filter:blur(24px) saturate(180%);padding:1rem 6%;border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--mono);font-size:.95rem;color:var(--text);text-decoration:none;letter-spacing:.2em;display:flex;align-items:center;gap:.6rem}
.logo-mark{width:28px;height:28px;background:var(--gIndigo);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;flex-shrink:0}
.nav-links{display:flex;gap:.4rem;list-style:none;align-items:center}
.nav-links a{color:var(--textSub);text-decoration:none;font-size:.82rem;font-weight:500;letter-spacing:.03em;padding:.42rem .85rem;border-radius:9px;transition:all .25s}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--glassMd)}
.nav-cta{background:var(--indigo)!important;color:#fff!important;font-weight:600!important;box-shadow:0 4px 20px rgba(99,102,241,.3)}
.nav-cta:hover{background:var(--indigoD)!important;transform:translateY(-1px);box-shadow:0 8px 28px rgba(99,102,241,.4)!important}

/* ── HERO ──────────────────────────────────── */
.hero{height:100vh;min-height:700px;position:relative;display:flex;align-items:center;overflow:hidden}
#hc{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.04) 1px,transparent 1px);background-size:70px 70px;z-index:0}
.orb{position:absolute;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px)}
.orb1{width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.1),transparent 70%);top:-15%;left:5%}
.orb2{width:450px;height:450px;background:radial-gradient(circle,rgba(34,211,238,.07),transparent 70%);bottom:5%;right:10%}
.orb3{width:300px;height:300px;background:radial-gradient(circle,rgba(139,92,246,.06),transparent 70%);top:40%;right:30%}
.hero-in{position:relative;z-index:1;padding:0 6%;max-width:1000px}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.22);border-radius:50px;padding:.28rem .85rem .28rem .45rem;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.85rem;color:var(--emeraldL)}
.badge-dot{width:6px;height:6px;background:var(--emerald);border-radius:50%;animation:pulse 2s ease infinite;box-shadow:0 0 8px var(--emerald)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
.hero-name{font-size:clamp(3.5rem,8.5vw,6.8rem);font-weight:800;line-height:.93;letter-spacing:-.035em;margin-bottom:1.75rem}
.grad-text{background:linear-gradient(135deg,var(--indigoL) 0%,var(--cyan) 50%,var(--emeraldL) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ghost-text{-webkit-text-stroke:1.5px rgba(255,255,255,.1);-webkit-text-fill-color:transparent}
.hero-role{font-size:1.05rem;color:var(--textSub);margin-bottom:1.5rem;min-height:1.6rem}
.hero-role b{color:var(--cyan);font-weight:600}
.blink{display:inline-block;width:2px;height:1em;background:var(--cyan);margin-left:2px;animation:blink 1s step-end infinite;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.hero-desc{font-size:1.02rem;color:var(--textSub);max-width:500px;line-height:1.9;margin-bottom:2.5rem}
.hero-actions{display:flex;gap:.85rem;flex-wrap:wrap;margin-bottom:3.5rem}
.btn-p{display:inline-flex;align-items:center;gap:.5rem;background:var(--indigo);color:#fff;padding:.85rem 1.8rem;border-radius:12px;text-decoration:none;font-weight:600;font-size:.88rem;border:none;cursor:none;font-family:var(--font);transition:all .3s;position:relative;overflow:hidden}
.btn-p::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.12));opacity:0;transition:opacity .3s}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(99,102,241,.45)}
.btn-p:hover::after{opacity:1}
.btn-g{display:inline-flex;align-items:center;gap:.5rem;background:transparent;color:var(--text);padding:.85rem 1.8rem;border-radius:12px;text-decoration:none;font-weight:500;font-size:.88rem;border:1px solid var(--borderHi);cursor:none;transition:all .3s}
.btn-g:hover{border-color:var(--indigo);color:var(--indigoL);background:rgba(99,102,241,.06);transform:translateY(-3px)}
.hero-stats{display:flex;gap:2.5rem;padding-top:2.5rem;border-top:1px solid var(--border)}
.hs-num{font-family:var(--mono);font-size:1.55rem;font-weight:700;background:var(--gIndigo);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hs-lbl{font-size:.68rem;color:var(--textMuted);text-transform:uppercase;letter-spacing:.09em;margin-top:.18rem}
.scroll-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--textMuted);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase}
.scroll-line{width:1px;height:48px;background:linear-gradient(to bottom,var(--indigo),transparent);animation:sdown 2s ease-in-out infinite}
@keyframes sdown{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ── SECTIONS ─────────────────────────────── */
.sec{padding:8rem 6%;position:relative}
.sec-alt{background:var(--bg1)}
.sep{height:1px;background:linear-gradient(90deg,transparent,var(--indigo),var(--cyan),transparent);opacity:.1}
.sec-lbl{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--indigoL);margin-bottom:.75rem}
.sec-lbl::before{content:'';width:18px;height:1.5px;background:var(--indigo)}
.sec-ttl{font-size:clamp(2rem,4vw,3rem);font-weight:800;line-height:1.1;letter-spacing:-.025em;margin-bottom:1rem}
.sec-ttl .hl{background:var(--gIndigo);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sec-desc{font-size:1rem;color:var(--textSub);max-width:560px;line-height:1.85}
.fi{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.fi.v{opacity:1;transform:translateY(0)}

/* ── ABOUT ───────────────────────────────── */
.about-g{display:grid;grid-template-columns:340px 1fr;gap:5rem;align-items:start;margin-top:4rem}
.profile-card{background:var(--glass);border:1px solid var(--borderHi);border-radius:var(--rXl);padding:2.25rem;position:relative}
.profile-av{width:100%;aspect-ratio:1;background:linear-gradient(135deg,var(--bg3),var(--bg4));border-radius:var(--rLg);display:flex;align-items:center;justify-content:center;font-size:5.5rem;margin-bottom:1.75rem;border:1px solid var(--border);position:relative;overflow:hidden}
.profile-av::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(34,211,238,.05))}
.profile-name{font-size:1.2rem;font-weight:700;margin-bottom:.25rem}
.profile-role{font-size:.8rem;color:var(--indigoL);font-weight:500;margin-bottom:1.4rem}
.p-detail{display:flex;align-items:center;gap:.75rem;font-size:.82rem;color:var(--textSub);padding:.55rem 0;border-bottom:1px solid var(--border)}
.p-detail:last-child{border-bottom:none}
.p-detail i{color:var(--indigo);width:14px;text-align:center;font-size:.78rem}
.fl-badge{position:absolute;background:var(--bg2);border:1px solid var(--borderHi);border-radius:12px;padding:.7rem 1rem;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.fl-badge.tr{top:-1rem;right:-1.5rem}
.fl-badge.bl{bottom:-1rem;left:-1.5rem}
.fl-num{font-family:var(--mono);font-size:1.35rem;font-weight:700;background:var(--gIndigo);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.fl-lbl{font-size:.62rem;color:var(--textMuted);white-space:nowrap;margin-top:.1rem}
.about-right h3{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--textMuted);margin-bottom:1.25rem}
.skills-list{display:flex;flex-direction:column;gap:.8rem}
.sk-row{display:flex;flex-direction:column;gap:.32rem}
.sk-top{display:flex;justify-content:space-between}
.sk-name{font-size:.83rem;font-weight:500}
.sk-pct{font-family:var(--mono);font-size:.72rem;color:var(--indigoL)}
.sk-track{height:3px;background:var(--glassMd);border-radius:2px;overflow:hidden}
.sk-fill{height:100%;border-radius:2px;background:var(--gIndigo);transform-origin:left;transition:transform 1.5s cubic-bezier(.4,0,.2,1)}
.about-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:2rem}
.a-chip{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;font-weight:500;padding:.32rem .75rem;background:var(--glass);border:1px solid var(--border);border-radius:50px;color:var(--textSub);transition:all .25s}
.a-chip:hover{border-color:var(--indigo);color:var(--indigoL);background:rgba(99,102,241,.06)}

/* ── SERVICES ────────────────────────────── */
.svc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:4rem}
.svc-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--rLg);padding:2rem;position:relative;overflow:hidden;transition:all .35s cubic-bezier(.4,0,.2,1);cursor:none}
.svc-card::before{content:'';position:absolute;inset:0;background:var(--gIndigo);opacity:0;transition:opacity .35s}
.svc-card:hover{border-color:rgba(99,102,241,.3);transform:translateY(-7px);box-shadow:0 24px 52px rgba(0,0,0,.3),var(--glow)}
.svc-card:hover::before{opacity:.055}
.svc-card>*{position:relative;z-index:1}
.svc-n{font-family:var(--mono);font-size:.62rem;color:var(--indigo);letter-spacing:.22em;margin-bottom:1.1rem}
.svc-ico{font-size:2.2rem;margin-bottom:1rem;display:block}
.svc-ttl{font-size:1rem;font-weight:700;margin-bottom:.55rem}
.svc-dsc{font-size:.81rem;color:var(--textSub);line-height:1.75;margin-bottom:1.3rem}
.tags{display:flex;flex-wrap:wrap;gap:.32rem}
.tag{font-size:.63rem;font-weight:600;padding:.2rem .6rem;background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.15);border-radius:50px;color:var(--indigoL)}

/* ── TIMELINE ────────────────────────────── */
.tl{position:relative;margin-top:4rem;max-width:880px;margin-left:auto;margin-right:auto}
.tl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--indigo),var(--cyan),transparent);transform:translateX(-50%);opacity:.35}
.tl-row{display:grid;grid-template-columns:1fr 56px 1fr;gap:1.5rem;margin-bottom:3.5rem;align-items:center}
.tl-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem 1.75rem;transition:all .3s}
.tl-card:hover{border-color:rgba(99,102,241,.25);transform:translateY(-3px);box-shadow:var(--glow)}
.tl-date{font-family:var(--mono);font-size:.63rem;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.4rem}
.tl-role{font-size:.9rem;font-weight:700;margin-bottom:.18rem}
.tl-co{font-size:.76rem;color:var(--indigoL);margin-bottom:.65rem;font-weight:500}
.tl-dsc{font-size:.79rem;color:var(--textSub);line-height:1.75}
.tl-mid{display:flex;justify-content:center;align-items:center}
.tl-dot{width:13px;height:13px;background:var(--gIndigo);border-radius:50%;box-shadow:0 0 18px rgba(99,102,241,.6);z-index:1;position:relative}
.tl-dot::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(99,102,241,.28)}

/* ── STATS ───────────────────────────────── */
.stats-sec{padding:6rem 6%;position:relative;overflow:hidden}
.stats-sec::before{content:'';position:absolute;top:-30%;left:-5%;width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.06),transparent 65%);border-radius:50%;pointer-events:none}
.stats-g{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2rem;position:relative;z-index:1}
.st-card{text-align:center;padding:1.75rem 1rem;background:var(--glass);border:1px solid var(--border);border-radius:var(--rLg);transition:all .3s}
.st-card:hover{transform:translateY(-7px);border-color:rgba(99,102,241,.25);box-shadow:var(--glow)}
.st-ico{font-size:1.5rem;margin-bottom:.75rem}
.st-val{font-family:var(--mono);font-size:2rem;font-weight:700;background:var(--gIndigo);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:.45rem}
.st-lbl{font-size:.62rem;color:var(--textMuted);text-transform:uppercase;letter-spacing:.1em}

/* ── PROJECTS ────────────────────────────── */
.proj-hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2.75rem;flex-wrap:wrap;gap:1.5rem}
.f-tabs{display:flex;gap:.45rem;flex-wrap:wrap}
.ftab{background:var(--glass);border:1px solid var(--border);color:var(--textSub);padding:.38rem 1rem;border-radius:9px;font-size:.79rem;font-weight:500;cursor:none;transition:all .25s;font-family:var(--font)}
.ftab.on,.ftab:hover{background:var(--indigo);border-color:var(--indigo);color:#fff;box-shadow:0 4px 18px rgba(99,102,241,.3)}
.proj-g{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem}
.proj-g .featured{grid-column:span 2}
.proj-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--rXl);overflow:hidden;transition:all .4s cubic-bezier(.4,0,.2,1);cursor:none}
.proj-card:hover{border-color:rgba(99,102,241,.25);transform:translateY(-7px);box-shadow:0 30px 60px rgba(0,0,0,.35),var(--glow)}

/* ── Project Thumbnails ── */
.proj-thumb{height:220px;position:relative;overflow:hidden;background:var(--bg3)}
.featured .proj-thumb{height:260px}
.thumb-bg{position:absolute;inset:0}

/* Browser Mock */
.m-browser{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px}
.b-win{width:100%;flex:1;background:var(--bg2);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.b-bar{height:28px;background:rgba(255,255,255,.04);display:flex;align-items:center;padding:0 10px;gap:5px;border-bottom:1px solid rgba(255,255,255,.05)}
.bd{width:8px;height:8px;border-radius:50%}
.bd-r{background:#ff5f57}.bd-y{background:#ffbd2e}.bd-g{background:#28ca41}
.b-url{flex:1;margin:0 10px;height:15px;background:rgba(255,255,255,.06);border-radius:4px;font-size:.52rem;display:flex;align-items:center;padding:0 7px;color:var(--textMuted);font-family:var(--mono)}
.b-body{padding:12px;flex:1;overflow:hidden}
.b-nav{height:18px;background:rgba(255,255,255,.04);border-radius:4px;margin-bottom:9px;display:flex;align-items:center;padding:0 8px;gap:6px}
.b-logo{width:36px;height:7px;border-radius:3px}
.b-lnks{display:flex;gap:4px;margin-left:auto}
.b-lnk{width:20px;height:5px;background:rgba(255,255,255,.1);border-radius:2px}
.b-hero{height:44px;border-radius:5px;margin-bottom:8px;display:flex;align-items:center;padding:0 10px;gap:8px}
.b-h1{height:7px;border-radius:3px;margin-bottom:3px}
.b-h2{height:5px;border-radius:2px;width:60%}
.b-cards{display:flex;gap:5px}
.b-card{flex:1;height:34px;background:rgba(255,255,255,.04);border-radius:4px;border:1px solid rgba(255,255,255,.06)}

/* Phone Mock */
.m-phone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ph-wrap{position:relative}
.ph-frame{width:115px;height:196px;background:var(--bg2);border-radius:22px;border:1.5px solid rgba(255,255,255,.1);overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.5)}
.ph-notch{height:16px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center}
.ph-notch-inner{width:36px;height:8px;background:var(--bg3);border-radius:0 0 8px 8px}
.ph-inner{padding:6px;display:flex;flex-direction:column;gap:4px}
.ph-header{height:54px;border-radius:8px;margin-bottom:2px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}
.ph-h-line{height:6px;border-radius:3px;background:rgba(255,255,255,.55)}
.ph-h-sub{height:4px;border-radius:2px;width:55%;background:rgba(255,255,255,.25)}
.ph-item{height:26px;background:rgba(255,255,255,.04);border-radius:6px;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;padding:0 6px;gap:5px}
.ph-dot{width:11px;height:11px;border-radius:50%}
.ph-line{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:2px}
.ph-chip{width:20px;height:7px;border-radius:3px;opacity:.7}
.ph-stats{display:flex;gap:4px}
.ph-stat{flex:1;height:26px;background:rgba(255,255,255,.04);border-radius:5px;border:1px solid rgba(255,255,255,.06)}

/* Video Player Mock */
.m-video{position:absolute;inset:0}
.vid-container{position:absolute;inset:10px 12px;border-radius:12px;overflow:hidden}
.vid-bg{position:absolute;inset:0}
.vid-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.vid-top{display:flex;justify-content:space-between;align-items:flex-start}
.vid-badge{font-size:.52rem;font-weight:700;padding:2px 6px;border-radius:3px;background:#ff0000;color:#fff;font-family:var(--mono)}
.vid-views{font-size:.55rem;color:rgba(255,255,255,.7);background:rgba(0,0,0,.4);padding:2px 5px;border-radius:4px}
.vid-bottom{display:flex;flex-direction:column;gap:4px}
.vid-t1{height:7px;background:rgba(255,255,255,.65);border-radius:3px;width:65%}

function useScrolled(t=50){

function useVisible(ref){

    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);o.disconnect();}},{threshold:.1});
    if(ref.current)o.observe(ref.current);return()=>o.disconnect();
  },[]);
  return v;
}
function useTyped(words,speed=90,pause=2000){
  const[txt,setTxt]=useState('');const[wi,setWi]=useState(0);const[ci,setCi]=useState(0);const[del,setDel]=useState(false);
  useEffect(()=>{
    const w=words[wi];const delay=del?speed/2:ci===w.length?pause:speed;
    const t=setTimeout(()=>{
      if(!del&&ci<w.length){setTxt(w.slice(0,ci+1));setCi(c=>c+1);}
      else if(!del&&ci===w.length)setDel(true);
      else if(del&&ci>0){setTxt(w.slice(0,ci-1));setCi(c=>c-1);}
      else{setDel(false);setWi(i=>(i+1)%words.length);}
    },delay);
    return()=>clearTimeout(t);
  },[txt,ci,del,wi]);
  return txt;
}
function useCounter(target,dur=2000,go=false){
  const[n,setN]=useState(0);

    if(!go)return;let st;

    requestAnimationFrame(step);
  },[go,target,dur]);
  return n;
}

    const out=()=>{if(ring.current)ring.current.classList.remove('hov');};
    window.addEventListener('mousemove',mv);
    document.querySelectorAll('a,button,.proj-card,.svc-card,.st-card').forEach(el=>{el.addEventListener('mouseenter',over);el.addEventListener('mouseleave',out);});

/* ══ CANVAS ═════════════════════════════════════════════════════ */
function Canvas(){
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current,ctx=c.getContext('2d');let id;
    const rz=()=>{c.width=innerWidth;c.height=innerHeight;};rz();window.addEventListener('resize',rz);
    const pts=Array.from({length:65},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.6+.6,a:Math.random()*.45+.15}));
    let mx=-999,my=-999;window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    const draw=()=>{
      ctx.clearRect(0,0,c.width,c.height);
      for(let i=0;i<pts.length;i++){
        for(let j=i+1;j<pts.length;j++){
          const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
          if(d<120){ctx.beginPath();ctx.strokeStyle=`rgba(99,102,241,${(1-d/120)*.15})`;ctx.lineWidth=1;ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}
        }
        const md=Math.sqrt((pts[i].x-mx)**2+(pts[i].y-my)**2);
        if(md<150){ctx.beginPath();ctx.strokeStyle=`rgba(34,211,238,${(1-md/150)*.32})`;ctx.lineWidth=1;ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(mx,my);ctx.stroke();}
        pts[i].x+=pts[i].vx;pts[i].y+=pts[i].vy;
        if(pts[i].x<0||pts[i].x>c.width)pts[i].vx*=-1;
        if(pts[i].y<0||pts[i].y>c.height)pts[i].vy*=-1;
        ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,pts[i].r,0,Math.PI*2);ctx.fillStyle=`rgba(99,102,241,${pts[i].a})`;ctx.fill();
      }
      id=requestAnimationFrame(draw);
    };draw();
    return()=>{cancelAnimationFrame(id);window.removeEventListener('resize',rz);};
  },[]);
  return<canvas ref={ref} id="hc"/>;
}

              <p className="proj-dsc">{p.desc}</p>

                  <div key={r.l} className="r-item">

/* ══ APP ════════════════════════════════════════════════════════ */
function App(){
  const[active,setActive]=useState('home');
  useEffect(()=>{
    const secs=document.querySelectorAll('section[id],div[id]');
    const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setActive(e.target.id);}),{threshold:.35});
    secs.forEach(s=>o.observe(s));return()=>o.disconnect();
  },[]);
  return(
    <>
      <Cursor/>
      <Navbar active={active}/>
      <Hero/>
      <div className="sep"/>
      <About/>
      <div className="sep"/>
      <Services/>
      <div className="sep"/>
      <Timeline/>
      <div className="sep"/>
      <Stats/>
      <div className="sep"/>
      <Projects/>
      <div className="sep"/>
      <Testimonials/>
      <div className="sep"/>
      <TechStack/>
      <div className="sep"/>
      <FAQ/>
      <div className="sep"/>
      <Contact/>
      <Footer/>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
