<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Adam | Developer & Creative</title>

  <!-- React 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Icons & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a12;--bg2:#0f0f1e;--bg3:#14142a;
      --glass:rgba(255,255,255,0.03);--glass-b:rgba(255,255,255,0.08);
      --primary:#7c6bff;--secondary:#00d4ff;--accent:#ff6b9d;
      --gold:#ffd700;--green:#00ff88;
      --text:#e2e8f0;--muted:#8892a4;--dim:#4a5568;
      --border:rgba(255,255,255,0.06);--radius:16px;
      --glow:0 0 30px rgba(124,107,255,0.3);
    }
    html{scroll-behavior:smooth}
    body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;cursor:none}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--primary);border-radius:2px}

    /* CURSOR */
    .cur-dot{width:8px;height:8px;background:var(--primary);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:10000;transform:translate(-50%,-50%)}
    .cur-ring{width:36px;height:36px;border:1.5px solid rgba(124,107,255,0.5);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:all .12s ease}

    /* NAVBAR */
    .nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:1.5rem 5%;display:flex;justify-content:space-between;align-items:center;transition:all .3s}
    .nav.solid{background:rgba(10,10,18,0.95);backdrop-filter:blur(20px);padding:1rem 5%;border-bottom:1px solid var(--border)}
    .nav-logo{font-family:'Space Mono',monospace;font-size:1.1rem;color:var(--primary);text-decoration:none;letter-spacing:3px;font-weight:700}
    .nav-links{display:flex;gap:2rem;list-style:none;align-items:center}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:500;letter-spacing:1px;text-transform:uppercase;transition:color .3s;position:relative}
    .nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1.5px;background:var(--primary);transition:width .3s}
    .nav-links a:hover,.nav-links a.active{color:var(--text)}
    .nav-links a:hover::after,.nav-links a.active::after{width:100%}
    .nav-cta{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff!important;padding:.5rem 1.4rem;border-radius:50px;font-weight:600!important}
    .nav-cta::after{display:none!important}

    /* HERO */
    .hero{height:100vh;position:relative;display:flex;align-items:center;overflow:hidden}
    #hc{position:absolute;inset:0;width:100%;height:100%;z-index:0}
    .hero-in{position:relative;z-index:1;padding:0 5%;max-width:950px}
    .hero-tag{display:inline-flex;align-items:center;gap:.6rem;background:rgba(124,107,255,0.1);border:1px solid rgba(124,107,255,0.2);color:var(--primary);padding:.4rem 1rem;border-radius:50px;font-size:.75rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:2rem}
    .hero-tag .dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
    .hero-name{font-size:clamp(3.5rem,9vw,7.5rem);font-weight:700;line-height:.92;margin-bottom:1.5rem;letter-spacing:-2px}
    .grad{background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .stroke{-webkit-text-stroke:2px rgba(255,255,255,0.15);color:transparent}
    .hero-typed{font-size:1.15rem;color:var(--muted);margin-bottom:2.5rem;min-height:2rem}
    .hero-typed b{color:var(--secondary)}
    .blink{display:inline-block;width:2px;height:1.1em;background:var(--secondary);margin-left:2px;animation:blink 1s infinite;vertical-align:middle}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    .hero-desc{font-size:1.05rem;color:var(--muted);max-width:520px;line-height:1.9;margin-bottom:3rem}
    .hero-btns{display:flex;gap:1rem;flex-wrap:wrap}
    .btn-p{background:linear-gradient(135deg,var(--primary),#9b8fff);color:#fff;padding:.9rem 2rem;border-radius:50px;text-decoration:none;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:.5rem;transition:all .3s;border:none;cursor:none;font-family:'Space Grotesk',sans-serif}
    .btn-p:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(124,107,255,0.4)}
    .btn-o{background:transparent;color:var(--text);padding:.9rem 2rem;border-radius:50px;text-decoration:none;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:.5rem;transition:all .3s;border:1px solid var(--border);cursor:none}
    .btn-o:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-3px)}
    .hero-scroll{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--muted);font-size:.7rem;letter-spacing:2px;text-transform:uppercase}
    .scrl-line{width:1px;height:55px;background:linear-gradient(to bottom,var(--primary),transparent);animation:scrl 2s ease-in-out infinite}
    @keyframes scrl{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}50.01%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
    .hero-stats{display:flex;gap:3rem;margin-top:3rem;padding-top:2.5rem;border-top:1px solid var(--border)}
    .hs-num{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:'Space Mono',monospace}
    .hs-lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:.2rem}

    /* SECTIONS */
    .sec{padding:8rem 5%;position:relative}
    .sec-alt{background:var(--bg2)}
    .sec-tag{display:inline-flex;align-items:center;gap:.4rem;color:var(--primary);font-size:.75rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:.75rem;font-family:'Space Mono',monospace}
    .sec-tag::before{content:'//';color:var(--secondary)}
    .sec-title{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:700;line-height:1.1;margin-bottom:1.2rem}
    .sec-title .ac{background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .sec-desc{font-size:1rem;color:var(--muted);max-width:580px;line-height:1.85}
    .glow-line{height:1px;background:linear-gradient(to right,transparent,var(--primary),var(--secondary),transparent);opacity:.25}
    .fade-in{opacity:0;transform:translateY(28px);transition:opacity .75s ease,transform .75s ease}
    .fade-in.vis{opacity:1;transform:translateY(0)}

    /* ABOUT */
    .about-g{display:grid;grid-template-columns:1fr 1.4fr;gap:5rem;align-items:center;margin-top:4rem}
    .img-frame{width:100%;max-width:360px;aspect-ratio:3/4;background:var(--bg3);border-radius:var(--radius);position:relative;border:1px solid var(--glass-b);overflow:hidden;display:flex;align-items:center;justify-content:center}
    .img-frame::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,18,.8),transparent 55%)}
    .img-emoji{font-size:7rem;opacity:.12;user-select:none}
    .a-badge{position:absolute;background:rgba(15,15,30,.9);border:1px solid var(--glass-b);border-radius:12px;padding:.85rem 1.25rem;backdrop-filter:blur(20px)}
    .a-badge.tr{top:-1rem;right:-2rem}
    .a-badge.bl{bottom:-1rem;left:-2rem}
    .b-num{font-size:1.6rem;font-weight:700;color:var(--primary);font-family:'Space Mono',monospace}
    .b-lbl{font-size:.7rem;color:var(--muted);white-space:nowrap}
    .skills-g{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;margin-top:2rem}
    .sk-item{background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:.9rem 1rem;transition:all .3s}
    .sk-item:hover{background:rgba(124,107,255,.05);border-color:rgba(124,107,255,.2);transform:translateY(-2px)}
    .sk-name{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:.5rem}
    .sk-pct{color:var(--primary);font-family:'Space Mono',monospace;font-size:.78rem}
    .sk-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
    .sk-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:2px;transform-origin:left;transition:transform 1.5s cubic-bezier(.4,0,.2,1)}

    /* SERVICES */
    .svc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-top:4rem}
    .svc-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--radius);padding:2rem;transition:all .4s;position:relative;overflow:hidden;cursor:none}
    .svc-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--primary),var(--secondary));opacity:0;transition:opacity .4s}
    .svc-card:hover{transform:translateY(-8px);border-color:transparent;box-shadow:0 30px 60px rgba(0,0,0,.4),var(--glow)}
    .svc-card:hover::before{opacity:.06}
    .svc-card>*{position:relative;z-index:1}
    .svc-num{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--primary);margin-bottom:1rem;letter-spacing:2px}
    .svc-ico{font-size:2rem;margin-bottom:1rem;display:block}
    .svc-ttl{font-size:1.05rem;font-weight:600;margin-bottom:.6rem}
    .svc-dsc{font-size:.83rem;color:var(--muted);line-height:1.75;margin-bottom:1.4rem}
    .tags{display:flex;flex-wrap:wrap;gap:.35rem}
    .tag{font-size:.68rem;padding:.22rem .6rem;background:rgba(124,107,255,.08);border:1px solid rgba(124,107,255,.15);border-radius:50px;color:var(--primary);font-weight:500}

    /* TIMELINE */
    .tl{position:relative;margin-top:4rem}
    .tl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--primary),var(--secondary),transparent);transform:translateX(-50%)}
    .tl-item{display:grid;grid-template-columns:1fr 56px 1fr;gap:1.5rem;margin-bottom:3.5rem;align-items:center}
    .tl-box{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--radius);padding:1.5rem 2rem;transition:all .3s}
    .tl-box:hover{border-color:rgba(124,107,255,.25);transform:translateY(-4px);box-shadow:var(--glow)}
    .tl-dot{width:14px;height:14px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:50%;margin:0 auto;position:relative;z-index:1;box-shadow:0 0 20px rgba(124,107,255,.5)}
    .tl-date{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--secondary);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:1px}
    .tl-role{font-size:.95rem;font-weight:600;margin-bottom:.2rem}
    .tl-co{font-size:.82rem;color:var(--primary);margin-bottom:.6rem}
    .tl-dsc{font-size:.82rem;color:var(--muted);line-height:1.75}

    /* STATS */
    .stats-wrap{padding:6rem 5%;position:relative;overflow:hidden}
    .stats-wrap::before{content:'';position:absolute;top:-40%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(124,107,255,.08),transparent 70%);border-radius:50%}
    .stats-g{display:grid;grid-template-columns:repeat(6,1fr);gap:1.5rem;position:relative;z-index:1}
    .st-card{text-align:center;padding:2rem 1rem;background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--radius);transition:all .3s}
    .st-card:hover{transform:translateY(-8px);border-color:rgba(124,107,255,.25);box-shadow:var(--glow)}
    .st-ico{font-size:1.4rem;margin-bottom:.8rem}
    .st-num{font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:'Space Mono',monospace}
    .st-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:.4rem}

    /* PROJECTS */
    .proj-filter{display:flex;gap:.65rem;margin-top:2rem;margin-bottom:3rem;flex-wrap:wrap}
    .f-btn{background:transparent;border:1px solid var(--glass-b);color:var(--muted);padding:.45rem 1.1rem;border-radius:50px;font-size:.82rem;cursor:none;transition:all .3s;font-family:'Space Grotesk',sans-serif}
    .f-btn.on,.f-btn:hover{background:linear-gradient(135deg,var(--primary),var(--secondary));border-color:transparent;color:#fff}
    .proj-g{display:grid;grid-template-columns:repeat(2,1fr);gap:1.75rem}
    .proj-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--radius);overflow:hidden;transition:all .4s;cursor:none}
    .proj-card:hover{transform:translateY(-8px);box-shadow:0 30px 60px rgba(0,0,0,.4),var(--glow);border-color:rgba(124,107,255,.2)}
    .proj-thumb{height:190px;background:var(--bg3);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:4.5rem;opacity:.18}
    .proj-ov{position:absolute;inset:0;background:linear-gradient(135deg,var(--primary),var(--secondary));opacity:0;transition:opacity .4s;display:flex;align-items:center;justify-content:center;gap:1rem}
    .proj-card:hover .proj-ov{opacity:.92}
    .proj-lnk{background:#fff;color:var(--primary);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;transform:scale(0);transition:transform .3s}
    .proj-card:hover .proj-lnk{transform:scale(1)}
    .proj-body{padding:1.4rem}
    .proj-type{font-size:.68rem;color:var(--secondary);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:.4rem}
    .proj-ttl{font-size:1rem;font-weight:600;margin-bottom:.4rem}
    .proj-dsc{font-size:.82rem;color:var(--muted);line-height:1.65;margin-bottom:.9rem}

    /* TESTIMONIALS */
    .test-g{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-top:4rem}
    .test-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--radius);padding:2rem;transition:all .3s}
    .test-card:hover{transform:translateY(-6px);border-color:rgba(124,107,255,.2)}
    .test-q{font-size:2.2rem;color:var(--primary);opacity:.35;line-height:1;margin-bottom:.75rem}
    .test-stars{color:var(--gold);font-size:.82rem;margin-bottom:.9rem}
    .test-txt{font-size:.85rem;color:var(--muted);line-height:1.85;margin-bottom:1.4rem}
    .test-au{display:flex;align-items:center;gap:.9rem}
    .au-av{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;flex-shrink:0}
    .au-nm{font-weight:600;font-size:.88rem}
    .au-rl{font-size:.72rem;color:var(--muted)}

    /* MARQUEE */
    .mq-wrap{overflow:hidden;position:relative;margin-top:3rem}
    .mq-wrap::before,.mq-wrap::after{content:'';position:absolute;top:0;bottom:0;width:120px;z-index:1}
    .mq-wrap::before{left:0;background:linear-gradient(to right,var(--bg),transparent)}
    .mq-wrap::after{right:0;background:linear-gradient(to left,var(--bg),transparent)}
    .mq-track{display:flex;gap:1.5rem;width:max-content;animation:mq 22s linear infinite}
    .mq-track:hover{animation-play-state:paused}
    @keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .tp{background:var(--glass);border:1px solid var(--glass-b);border-radius:50px;padding:.65rem 1.3rem;display:flex;align-items:center;gap:.65rem;white-space:nowrap;transition:all .3s;cursor:default}
    .tp:hover{border-color:var(--primary);background:rgba(124,107,255,.05)}
    .tp-ico{font-size:1.15rem}
    .tp-nm{font-size:.82rem;font-weight:500}

    /* FAQ */
    .faq-list{max-width:760px;margin:4rem auto 0}
    .faq-item{border-bottom:1px solid var(--border)}
    .faq-q{width:100%;background:none;border:none;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:500;text-align:left;padding:1.4rem 0;display:flex;justify-content:space-between;align-items:center;cursor:none;transition:color .3s}
    .faq-q:hover{color:var(--primary)}
    .faq-ico{width:26px;height:26px;background:var(--glass);border:1px solid var(--glass-b);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0;transition:all .3s}
    .faq-item.op .faq-ico{background:var(--primary);border-color:var(--primary);transform:rotate(45deg)}
    .faq-ans{overflow:hidden;max-height:0;transition:max-height .4s ease,padding-bottom .4s}
    .faq-item.op .faq-ans{max-height:300px;padding-bottom:1.4rem}
    .faq-ans p{font-size:.87rem;color:var(--muted);line-height:1.85}

    /* CONTACT */
    .ct-g{display:grid;grid-template-columns:1fr 1.5fr;gap:4rem;margin-top:4rem}
    .ct-info{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--radius);padding:2.5rem}
    .ct-item{display:flex;align-items:center;gap:.9rem;padding:.9rem 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text);transition:all .3s}
    .ct-item:last-child{border-bottom:none}
    .ct-item:hover{color:var(--primary)}
    .ct-item:hover .ct-ico{background:var(--primary);border-color:var(--primary)}
    .ct-ico{width:42px;height:42px;background:var(--glass);border:1px solid var(--glass-b);border-radius:10px;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0}
    .ct-lbl{font-size:.7rem;color:var(--muted);margin-bottom:.15rem}
    .ct-val{font-size:.88rem;font-weight:500}
    .ct-form{display:flex;flex-direction:column;gap:1.15rem}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1.15rem}
    .fg{display:flex;flex-direction:column;gap:.4rem}
    .flbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
    .finp{background:var(--glass);border:1px solid var(--glass-b);border-radius:10px;padding:.8rem 1.1rem;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:.88rem;transition:all .3s;outline:none;resize:vertical}
    .finp:focus{border-color:var(--primary);background:rgba(124,107,255,.04);box-shadow:0 0 0 3px rgba(124,107,255,.1)}
    .finp::placeholder{color:var(--dim)}
    .sent-msg{color:var(--green);font-size:.88rem;display:flex;align-items:center;gap:.4rem}

    /* FOOTER */
    .footer{background:var(--bg2);padding:2.5rem 5%;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .f-logo{font-family:'Space Mono',monospace;font-size:1rem;color:var(--primary);letter-spacing:3px}
    .f-txt{font-size:.75rem;color:var(--dim);text-align:center}
    .f-soc{display:flex;gap:.85rem}
    .soc-btn{width:36px;height:36px;background:var(--glass);border:1px solid var(--glass-b);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-size:.85rem;transition:all .3s}
    .soc-btn:hover{background:var(--primary);border-color:var(--primary);color:#fff;transform:translateY(-3px)}

    @media(max-width:1024px){
      .sec,.stats-wrap{padding:6rem 4%}
      .svc-g{grid-template-columns:repeat(2,1fr)}
      .stats-g{grid-template-columns:repeat(3,1fr)}
      .about-g{grid-template-columns:1fr}
      .ct-g{grid-template-columns:1fr}
    }
    @media(max-width:768px){
      .sec,.stats-wrap{padding:4rem 5%}
      .nav-links{display:none}
      .svc-g,.proj-g,.test-g{grid-template-columns:1fr}
      .stats-g{grid-template-columns:repeat(2,1fr)}
      .hero-stats{gap:1.5rem;flex-wrap:wrap}
      .form-row{grid-template-columns:1fr}
      .footer{flex-direction:column;gap:1.5rem;text-align:center}
      .tl::before{left:22px}
      .tl-item{grid-template-columns:44px 1fr;grid-template-rows:auto}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── DATA ─────────────────────────────────────────────── */
const SKILLS = [
  { name: 'HTML & CSS', pct: 85 },{ name: 'UI/UX Design', pct: 80 },
  { name: 'Python', pct: 70 },{ name: 'Copywriting', pct: 88 },
  { name: 'Video Editing', pct: 90 },{ name: 'Network Eng.', pct: 75 },
];

/* ── HOOKS ───────────────────────────────────────────── */
function useScrolled(t=50){
  const [s,setS]=useState(false);
  useEffect(()=>{const fn=()=>setS(window.scrollY>t);window.addEventListener('scroll',fn);return()=>window.removeEventListener('scroll',fn)},[t]);
  return s;
}
function useVisible(ref){
  const [v,setV]=useState(false);
  useEffect(()=>{
    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);o.disconnect();}},{threshold:.12});
    if(ref.current)o.observe(ref.current);
    return()=>o.disconnect();
  },[]);
  return v;
}
function useTyped(words,speed=95,pause=2200){
  const [txt,setTxt]=useState('');const[wi,setWi]=useState(0);const[ci,setCi]=useState(0);const[del,setDel]=useState(false);
  useEffect(()=>{
    const w=words[wi];
    const delay=del?speed/2:(ci===w.length?pause:speed);
    const t=setTimeout(()=>{
      if(!del&&ci<w.length){setTxt(w.slice(0,ci+1));setCi(c=>c+1);}
      else if(!del&&ci===w.length){setDel(true);}
      else if(del&&ci>0){setTxt(w.slice(0,ci-1));setCi(c=>c-1);}
      else{setDel(false);setWi(i=>(i+1)%words.length);}
    },delay);
    return()=>clearTimeout(t);
  },[txt,ci,del,wi]);
  return txt;
}
function useCounter(target,dur=2000,go=false){
  const [n,setN]=useState(0);
  useEffect(()=>{
    if(!go)return;let st;
    const step=ts=>{if(!st)st=ts;const p=Math.min((ts-st)/dur,1);const e=1-Math.pow(1-p,3);setN(parseFloat((e*target).toFixed(1)));if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  },[go,target,dur]);
  return n;
}

/* Custom Cursor */
function Cursor(){
  const dot=useRef(null),ring=useRef(null),pos=useRef({x:0,y:0}),rp=useRef({x:0,y:0});
  useEffect(()=>{
    const mv=e=>{pos.current={x:e.clientX,y:e.clientY};if(dot.current){dot.current.style.left=e.clientX+'px';dot.current.style.top=e.clientY+'px';}};
    window.addEventListener('mousemove',mv);
    let raf;const anim=()=>{rp.current.x+=(pos.current.x-rp.current.x)*.12;rp.current.y+=(pos.current.y-rp.current.y)*.12;if(ring.current){ring.current.style.left=rp.current.x+'px';ring.current.style.top=rp.current.y+'px';}raf=requestAnimationFrame(anim);};anim();
    return()=>{window.removeEventListener('mousemove',mv);cancelAnimationFrame(raf);};
  },[]);
  return <><div ref={dot} className="cur-dot"/><div ref={ring} className="cur-ring"/></>;
}

/* Particle Canvas */
function Canvas(){
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current,ctx=c.getContext('2d');let id;
    const rz=()=>{c.width=innerWidth;c.height=innerHeight;};rz();window.addEventListener('resize',rz);
    const pts=Array.from({length:75},()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45,r:Math.random()*1.8+.8,a:Math.random()*.5+.2}));
    let mx=-999,my=-999;window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    const draw=()=>{
      ctx.clearRect(0,0,c.width,c.height);
      for(let i=0;i<pts.length;i++){
        for(let j=i+1;j<pts.length;j++){
          const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
          if(d<130){ctx.beginPath();ctx.strokeStyle=`rgba(124,107,255,${(1-d/130)*.18})`;ctx.lineWidth=1;ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}
        }
        const md=Math.sqrt((pts[i].x-mx)**2+(pts[i].y-my)**2);
        if(md<160){ctx.beginPath();ctx.strokeStyle=`rgba(0,212,255,${(1-md/160)*.38})`;ctx.lineWidth=1;ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(mx,my);ctx.stroke();}
        pts[i].x+=pts[i].vx;pts[i].y+=pts[i].vy;
        if(pts[i].x<0||pts[i].x>c.width)pts[i].vx*=-1;
        if(pts[i].y<0||pts[i].y>c.height)pts[i].vy*=-1;
        ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,pts[i].r,0,Math.PI*2);ctx.fillStyle=`rgba(124,107,255,${pts[i].a})`;ctx.fill();
      }
      id=requestAnimationFrame(draw);
    };draw();
    return()=>{cancelAnimationFrame(id);window.removeEventListener('resize',rz);};
  },[]);
  return <canvas ref={ref} id="hc"/>;
}

/* App */
function App(){
  const [active,setActive]=useState('home');
  useEffect(()=>{
    const secs=document.querySelectorAll('section[id],div[id]');
    const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setActive(e.target.id);}),{threshold:.45});
    secs.forEach(s=>o.observe(s));return()=>o.disconnect();
  },[]);
  return(
    <>
      <Cursor/>
      <Navbar active={active}/>
      <Hero/>
      <div className="glow-line"/>
      <About/>
      <div className="glow-line"/>
      <Services/>
      <div className="glow-line"/>
      <Timeline/>
      <div className="glow-line"/>
      <Stats/>
      <div className="glow-line"/>
      <Projects/>
      <div className="glow-line"/>
      <Testimonials/>
      <div className="glow-line"/>
      <TechStack/>
      <div className="glow-line"/>
      <FAQ/>
      <div className="glow-line"/>
      <Contact/>
      <Footer/>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
